<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ยืนยันยอดภายนอกทีม C-2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#ffffff;--card:#ffffff;--sh:0 1px 2px rgba(20,30,28,.06),0 8px 22px rgba(20,30,28,.09);--shh:0 2px 4px rgba(20,30,28,.08),0 14px 30px rgba(20,30,28,.15);--tx:#1c2321;--mu:#68716d;--bd:#e7eae8;--ac:#0f6b5c;--acb:#d8ece6;--on:#fff;--ok:#1a7f4b;--okb:#dff2e6;--wt:#946000;--wtb:#fbefcf;--rd:#b42318;--gy:#59636e;--gyb:#e9e6de;--bl:#1f5fbf;--blb:#e1ecfa;--pu:#6b4bb8;--pub:#ece6fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161a;--card:#1b2127;--tx:#e8ece9;--mu:#97a29d;--bd:#2d3640;--ac:#5cc5ae;--acb:#173a33;--on:#08201b;--ok:#5fd394;--okb:#16352a;--wt:#f0c050;--wtb:#3a3014;--rd:#ff8f84;--gy:#aab3bd;--gyb:#262d35;--bl:#8db8f8;--blb:#1b2c47;--pu:#b9a2f5;--pub:#2b2347;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161a;--card:#1b2127;--tx:#e8ece9;--mu:#97a29d;--bd:#2d3640;--ac:#5cc5ae;--acb:#173a33;--on:#08201b;--ok:#5fd394;--okb:#16352a;--wt:#f0c050;--wtb:#3a3014;--rd:#ff8f84;--gy:#aab3bd;--gyb:#262d35;--bl:#8db8f8;--blb:#1b2c47;--pu:#b9a2f5;--pub:#2b2347;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Thai","Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--bd)}
.top small{display:block;font-size:12px;letter-spacing:.04em;color:var(--ac);font-weight:600;margin-bottom:4px}
h1{font-size:26px;line-height:1.25;margin:0;font-weight:600}
.mp{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px}
.mp b{font-size:16px;font-weight:600;min-width:150px;text-align:center}
.mp button{background:transparent;color:var(--tx);border:0;border-radius:50%;width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.mp button:hover{background:var(--acb);color:var(--ac)}
.up{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:8px;counter-reset:s}
.upb{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 14px 14px 52px;position:relative;transition:border-color .15s,transform .15s}
.upb:hover{border-color:var(--ac);transform:translateY(-2px)}
.upb::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--acb);color:var(--ac);font-weight:600;font-size:13px;display:grid;place-items:center}
.upb b{display:block;margin-bottom:8px;font-weight:600;font-size:14px}
.upb input[type=file]{width:100%;font-size:13px;color:var(--mu)}
.upb input[type=file]::file-selector-button{font:inherit;font-size:13px;background:transparent;color:var(--ac);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;margin-right:8px;cursor:pointer}
.msg{color:var(--mu);font-size:13px;margin:0 0 24px;min-height:20px}
.type{font-size:12px;color:var(--mu);display:block;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:600}
.stat span{font-size:13px;color:var(--mu)}
.stat.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.stat:nth-child(1){background:var(--ac);border-color:var(--ac);color:var(--on)}
.stat:nth-child(1) span{color:var(--on);opacity:.85}
.stat:nth-child(3){border-top-color:var(--gy)}.stat:nth-child(4){border-top-color:var(--wt)}.stat:nth-child(5){border-top-color:var(--bl)}.stat:nth-child(6){border-top-color:var(--pu)}.stat:nth-child(7){border-top-color:var(--ok)}
.panel{margin-bottom:18px}
.ph{margin:0 0 14px;font-size:16px;font-weight:600}
.ck{display:inline-flex;align-items:center;gap:6px;margin-right:16px;white-space:nowrap;font-size:14px;cursor:pointer}
.ck input{width:auto;accent-color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.bar #q{order:1;flex:2 1 260px}
.bar #newCust{order:2;flex:1 1 200px}
.bar #addCust{order:3}.bar #exp{order:4;margin-left:auto}
input,button,select,textarea{font:inherit;color:var(--tx)}
input[type=text],input[type=date]{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;min-width:0}
input[type=date]{width:100%;padding:6px 8px;font-size:14px}
.dc{display:flex;align-items:center;gap:6px}
.dc input[type=date]{flex:1;min-width:0}
.pw{position:relative;flex:1;min-width:150px;display:flex;align-items:center}
.pw .dt{width:100%;padding:6px 34px 6px 9px;font-size:14px;font-variant-numeric:tabular-nums}
.cal{position:absolute;right:3px;background:transparent;color:var(--mu);padding:4px;border-radius:6px;display:grid;place-items:center}
.cal:hover{color:var(--ac);filter:none;background:var(--acb)}
.pk{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.tick{background:transparent;border:0;padding:0;width:30px;height:30px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--mu)}
button.tick svg{width:28px;height:28px;display:block}
button.tick:hover{color:var(--ac)}
button.tick.on{color:var(--ok)}
button.tick.on .ring{fill:var(--okb)}
button{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:8px 15px;cursor:pointer;font-weight:500;transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.ghost:hover{border-color:var(--ac);filter:none}
button.x{background:transparent;color:var(--rd);padding:4px 8px}
.cust{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:16px;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ch h2{margin:0;font-size:17px;font-weight:600;flex:1}
.ch small{color:var(--mu);background:var(--gyb);border-radius:999px;padding:2px 10px;font-size:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1080px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td,tr:hover>td{background:color-mix(in srgb,var(--acb) 35%,transparent)}
th{font-size:12px;color:var(--mu);font-weight:600;background:var(--bg);letter-spacing:.02em}
td.bk{min-width:260px}
td.bk textarea{width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;min-width:0;resize:none;overflow:hidden;line-height:1.3;font-size:15px;display:block;white-space:normal;word-break:break-word}
td.bk textarea:hover,td.bk textarea:focus{background:var(--card);border-color:var(--bd)}
th.no,td.no{width:56px;text-align:center;color:var(--mu)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:13px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s0{background:var(--gyb);color:var(--gy)}.s1{background:var(--wtb);color:var(--wt)}.s2{background:var(--blb);color:var(--bl)}.s3{background:var(--pub);color:var(--pu)}.s4{background:var(--okb);color:var(--ok)}
.late{color:var(--rd);font-size:12px;display:block;margin-top:2px}
.empty{text-align:center;color:var(--mu);padding:44px 10px}
.cust,.upb,.stat,.mp{box-shadow:var(--sh)}
.upb:hover,.stat:hover{box-shadow:var(--shh)}
.stat.on{box-shadow:0 0 0 1px var(--ac),var(--sh)}
th{background:color-mix(in srgb,var(--gyb) 45%,var(--card))}
.panel .cust{padding:0}
th.no,td.no,th:nth-child(2),td:nth-child(2){position:sticky;z-index:2;background:var(--card)}
th.no,td.no{left:0}
th:nth-child(2),td:nth-child(2){left:56px;box-shadow:1px 0 0 var(--bd),8px 0 10px -8px rgba(0,0,0,.25)}
th.no,th:nth-child(2){z-index:3;background:color-mix(in srgb,var(--gyb) 45%,var(--card))}
tr:hover>td.no,tr:hover>td:nth-child(2){background:color-mix(in srgb,var(--acb) 35%,var(--card))}
@media (max-width:640px){th.no,td.no{width:34px;min-width:34px;padding:9px 2px}th:nth-child(2),td:nth-child(2){left:34px;padding:9px 6px}td.bk{min-width:160px;max-width:160px}td.bk textarea{padding:4px 5px}.type{font-size:11px}}
.panel .cust .scroll{max-height:none}
@media (max-width:640px){.wrap{padding:18px 14px 60px}h1{font-size:21px}.bar #exp{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><small>ทีม C-2 · ยืนยันยอดภายนอก</small><h1>ติดตามการยืนยันยอดบัญชีเงินฝากธนาคาร</h1></div>
    <div class="mp"><button type="button" id="pm" aria-label="เดือนก่อนหน้า">‹</button><b id="pl"></b><button type="button" id="pn" aria-label="เดือนถัดไป">›</button></div>
  </header>
  <div class="up">
    <div class="upb"><b>ไฟล์ธนาคาร</b><input type="file" accept=".csv,.xlsx,.xls" data-type="ธนาคาร"></div>
    <div class="upb"><b>ไฟล์สหกรณ์</b><input type="file" accept=".csv,.xlsx,.xls" data-type="สหกรณ์"></div>
    <div class="upb"><b>เงินลงทุนในหลักทรัพย์/ธนาคาร</b><input type="file" accept=".csv,.xlsx,.xls" data-type="เงินลงทุน"></div>
  </div>
  <div class="msg" id="msg">นำเข้าไฟล์ที่มีคอลัมน์ “ชื่อสหกรณ์/ลูกค้า” และ “ชื่อธนาคาร/หน่วยงาน” (ถ้ามี “เลขที่บัญชี” จะต่อท้ายให้) · ไม่มีหัวตารางจะใช้คอลัมน์ 1 = ลูกค้า, 2 = หน่วยงาน</div>
  <div class="stats" id="stats"></div>
  <div id="panel"></div>
  <div class="bar">
    <input type="text" id="q" placeholder="ค้นหาลูกค้า / ชื่อหน่วยงาน / ประเภท">
    <input type="text" id="newCust" placeholder="ชื่อลูกค้าใหม่">
    <button id="addCust">+ เพิ่มลูกค้า</button>
    <button class="ghost" id="exp">ส่งออก Excel</button>
  </div>
  <div id="list"></div>
</div>
<script>
var KEY="bankconfirm-v1",data=[],filter=-1,query="";
var LABEL=["ยังไม่ส่งลูกค้า","รอลูกค้าส่งกลับ","รอส่งออกภายนอก","รอภายนอกตอบกลับ","เสร็จสิ้น"];
function load(){try{var r=localStorage.getItem(KEY);if(r)data=JSON.parse(r)||[]}catch(e){data=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function status(b){if(b.backExt)return 4;if(b.sentExt)return 3;if(b.backCust)return 2;if(b.sentCust)return 1;return 0}
function picked(b){var tk=b.tk||{};return Object.keys(tk).filter(function(k){return tk[k]})[0]||""}
var TICK='<svg viewBox="0 0 32 32" aria-hidden="true"><circle class="ring" cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M9.5 16.5l4.5 4.5 8.5-9.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function tickBtn(b,f,k){return '<button type="button" class="tick'+(b[f]?' on':'')+'" data-a="tick" data-f="'+f+'" '+k+' title="'+(b[f]?'ล้างวันที่':'ใส่วันที่วันนี้')+'">'+TICK+'</button>'}
function today(){var d=new Date(),m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(y<10?"0":"")+y}
var ORDER={"ธนาคาร":0,"สหกรณ์":1,"เงินลงทุน":2};
function sorted(banks){return banks.map(function(b,i){return{b:b,i:i}}).sort(function(x,y){var a=ORDER[x.b.type],c=ORDER[y.b.type];a=a==null?9:a;c=c==null?9:c;return a-c||x.i-y.i}).map(function(o){return o.b})}
var CAL='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 2.5v3M17 2.5v3M3.5 9.5h17M5 4.5h14A1.5 1.5 0 0120.5 6v13a1.5 1.5 0 01-1.5 1.5H5A1.5 1.5 0 013.5 19V6A1.5 1.5 0 015 4.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
function fmt(v){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(v||"");return m?m[3]+"/"+m[2]+"/"+m[1]:""}
function parseD(s){var m=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s);if(!m)return null;var d=+m[1],mo=+m[2],y=+m[3],dt=new Date(y,mo-1,d);if(y<1900||dt.getMonth()!=mo-1||dt.getDate()!=d)return null;return m[3]+"-"+m[2]+"-"+m[1]}
function mask(s,nt){var d=s.replace(/\D/g,"").slice(0,8),o=d.slice(0,2);if(d.length>2||(d.length==2&&!nt))o+="/";if(d.length>2)o+=d.slice(2,4);if(d.length>4||(d.length==4&&!nt))o+="/";if(d.length>4)o+=d.slice(4);return o}
function commitD(t){var v=t.value,iso=v?parseD(v):"";if(v&&iso==null)return;var c=find(t.dataset.c),hb;c.banks.forEach(function(b){if(b.id==t.dataset.b){b[t.dataset.k]=iso;hb=b}});save();if(hb)liveUpdate(t,hb)}
function days(d){if(!d)return 0;return Math.floor((Date.now()-new Date(d).getTime())/864e5)}
function late(b){var s=status(b),d=s==1?days(b.sentCust):s==3?days(b.sentExt):0;return d>=14?"ค้างมาแล้ว "+d+" วัน":""}
function newBank(name,type){return{id:uid(),bank:name||"",type:type||"",sentCust:"",backCust:"",sentExt:"",backExt:""}}
var OPT={"สหกรณ์":["เงินฝาก","เงินให้กู้ยืม","เงินกู้ยืม","เงินลงทุน","เงินรับฝาก"],"เงินลงทุน":["เงินฝาก","เงินกู้ยืม","เงินลงทุน"]};
var panelOpen=false;
function setHtml(b){
  if(!OPT[b.type])return '<span class="type">—</span>';
  var tk=b.tk||{},pick=OPT[b.type].filter(function(o){return tk[o]})[0];
  return OPT[b.type].map(function(o){return '<label class="ck"><input type="checkbox" data-c="'+b.cid+'" data-b="'+b.id+'" data-o="'+esc(o)+'"'+(o===pick?' checked':'')+'> '+o+'</label>'}).join("");
}
function renderPanel(total){
  var p=document.getElementById("panel");
  if(!panelOpen){p.innerHTML="";return}
  var h='<div><h3 class="ph">ข้อมูลยืนยันยอดภายนอก '+total+' รายการ · สหกรณ์ '+data.length+' แห่ง · ติ๊กรายการที่ขอยืนยัน</h3>';
  data.forEach(function(c){
    h+='<div class="cust"><div class="ch"><h2>'+esc(c.name)+'</h2><small>'+c.banks.length+' รายการ</small></div>';
    if(c.banks.length){
      h+='<div class="scroll"><table><tr><th class="no">ลำดับ</th><th>ชื่อหน่วยงาน</th><th>ประเภทไฟล์</th><th>รายการที่ขอยืนยัน</th></tr>';
      sorted(c.banks).forEach(function(b,n){b.cid=c.id;
        h+='<tr><td class="no">'+(n+1)+'</td><td>'+esc(b.bank)+'</td><td>'+esc(b.type||"-")+'</td><td>'+setHtml(b)+'</td></tr>'});
      h+='</table></div>';
    }else h+='<div class="empty">ยังไม่มีรายการ</div>';
    h+='</div>';
  });
  if(!data.length)h+='<div class="empty">ยังไม่มีรายการ</div>';
  p.innerHTML=h+'</div>';
}
function render(){
  var cnt=[0,0,0,0,0],total=0;
  data.forEach(function(c){c.banks.forEach(function(b){cnt[status(b)]++;total++})});
  var h='<div class="stat'+(panelOpen?' on':'')+'" data-p="1"><b>'+total+'</b><span>ข้อมูลยืนยันยอดภายนอก · คลิกเพื่อติ๊ก</span></div>';
  h+='<div class="stat'+(!panelOpen&&filter==-1?' on':'')+'" data-f="-1"><b>'+total+'</b><span>ทั้งหมด</span></div>';
  for(var i=0;i<5;i++)h+='<div class="stat'+(!panelOpen&&filter==i?' on':'')+'" data-f="'+i+'"><b>'+cnt[i]+'</b><span>'+LABEL[i]+'</span></div>';
  document.getElementById("stats").innerHTML=h;
  renderPanel(total);
  var out="",q=query.toLowerCase();
  data.forEach(function(c){
    var cm=c.name.toLowerCase().indexOf(q)>-1;
    var rows=sorted(c.banks).filter(function(b){
      return (filter==-1||status(b)==filter)&&(!q||cm||b.bank.toLowerCase().indexOf(q)>-1||(b.type||"").toLowerCase().indexOf(q)>-1||picked(b).toLowerCase().indexOf(q)>-1)});
    if((filter!=-1||q)&&!rows.length)return;
    var done=c.banks.filter(function(b){return status(b)==4}).length;
    out+='<div class="cust"><div class="ch"><h2>'+esc(c.name)+'</h2><small>เสร็จ '+done+'/'+c.banks.length+' รายการ</small><button class="ghost" data-a="addbank" data-c="'+c.id+'">+ รายการ</button><button class="x" data-a="delcust" data-c="'+c.id+'">ลบลูกค้า</button></div>';
    if(rows.length){
      out+='<div class="scroll"><table><tr><th class="no">ลำดับ</th><th>1. ชื่อหน่วยงาน / ประเภท</th><th>2. ส่งให้ลูกค้า</th><th>3. ลูกค้าส่งกลับ</th><th>4. ส่งออกภายนอก</th><th>5. ภายนอกส่งกลับ</th><th>สถานะ</th><th></th></tr>';
      rows.forEach(function(b,n){
        var s=status(b),k='data-c="'+c.id+'" data-b="'+b.id+'"';
        out+='<tr><td class="no">'+(n+1)+'</td><td class="bk"><textarea rows="1" placeholder="ชื่อธนาคาร" data-k="bank" '+k+'>'+esc(b.bank)+'</textarea>'+(b.type?'<span class="type">ประเภท: '+esc(b.type)+(picked(b)?' · '+esc(picked(b)):'')+'</span>':'')+'</td>';
        ["sentCust","backCust","sentExt","backExt"].forEach(function(f){out+='<td><div class="dc"><span class="pw"><input type="text" class="dt" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="dd/mm/yyyy" value="'+fmt(b[f])+'" data-k="'+f+'" '+k+'><input type="date" class="pk" tabindex="-1" aria-hidden="true" value="'+esc(b[f])+'"><button type="button" class="cal" data-a="cal" '+k+' title="เลือกจากปฏิทิน">'+CAL+'</button></span>'+tickBtn(b,f,k)+'</div></td>'});
        out+='<td><span class="badge s'+s+'">'+LABEL[s]+'</span><span class="late">'+late(b)+'</span></td><td><button class="x" data-a="delbank" '+k+'>ลบ</button></td></tr>';
      });
      out+='</table></div>';
    }else out+='<div class="empty">ยังไม่มีรายการ กด + รายการ เพื่อเพิ่ม</div>';
    out+='</div>';
  });
  document.getElementById("list").innerHTML=out||'<div class="empty">ยังไม่มีข้อมูล เพิ่มชื่อลูกค้าหรือนำเข้าไฟล์ด้านบนเพื่อเริ่มต้น</div>';
  if(panelOpen)document.getElementById("list").innerHTML="";
  document.querySelector(".bar").style.display=panelOpen?"none":"";
}
function find(id){return data.filter(function(c){return c.id==id})[0]}
function say(t){document.getElementById("msg").textContent=t}
function cell(v){return String(v==null?"":v).replace(/\s+/g," ").trim()}
function parseRows(rows,type ){
  var hi=-1,ci=0,bi=1,ai=-1,i,j;
  for(i=0;i<Math.min(rows.length,12)&&hi<0;i++){
    var r=rows[i].map(cell),c=-1,b=-1,a=-1;
    r.forEach(function(t,k){
      if(/เลขที่/.test(t)){if(a<0)a=k}
      else if(/สหกรณ์|ลูกค้า/.test(t)){if(c<0)c=k}
      else if(/ธนาคาร|หน่วยงาน|สถาบัน|ผู้ออก/.test(t)){if(b<0)b=k}
    });
    if(c>=0&&b>=0){hi=i;ci=c;bi=b;ai=a}
  }
  var out=[];
  for(i=hi+1;i<rows.length;i++){
    var r2=rows[i],cn=cell(r2[ci]),bn=cell(r2[bi]);
    if(!cn||!bn)continue;
    if(type!="ธนาคาร"&&ai>=0&&cell(r2[ai]))bn+=" ("+cell(r2[ai])+")";
    out.push([cn,bn])
  }
  return {pairs:out,header:hi>=0};
}
function readBook(buf,name){
  if(/\.csv$/i.test(name)){
    var txt=new TextDecoder("utf-8").decode(buf);
    if(txt.indexOf("\uFFFD")>-1){try{txt=new TextDecoder("windows-874").decode(buf)}catch(e){}}
    return XLSX.read(txt,{type:"string"})
  }
  return XLSX.read(buf,{type:"array"})
}
function importFile(inp){
  var f=inp.files[0];if(!f)return;var type=inp.dataset.type;
  var fr=new FileReader();
  fr.onload=function(e){
    try{
      var wb=readBook(e.target.result,f.name);
var res={pairs:[],header:true},sheetInfo=[];
wb.SheetNames.forEach(function(sn){
  var r=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""}),type);
  res.pairs=res.pairs.concat(r.pairs);
  if(!r.header)res.header=false;
  sheetInfo.push(sn+" "+r.pairs.length);
});
      var added=0,skipped=0,newC=0;
      res.pairs.forEach(function(p){
        var c=data.filter(function(x){return x.name==p[0]})[0];
        if(!c){c={id:uid(),name:p[0],banks:[]};data.push(c);newC++}
        var dup=c.banks.some(function(b){return b.bank==p[1]&&b.type==type});
        if(dup){skipped++;return}
        c.banks.push(newBank(p[1],type));added++;
      });
      save();render();
      say("นำเข้า “"+type+"” จาก "+f.name+": เพิ่ม "+added+" รายการ (ลูกค้าใหม่ "+newC+" ราย), ข้ามรายการซ้ำ "+skipped+(res.header?"":" · ไม่พบหัวตาราง ใช้คอลัมน์ 1 และ 2"));
    }catch(err){say("อ่านไฟล์ไม่สำเร็จ: "+err.message)}
    inp.value="";
  };
  fr.readAsArrayBuffer(f);
}
document.querySelectorAll('.up input[type=file]').forEach(function(i){i.onchange=function(){importFile(i)}});
document.getElementById("exp").onclick=function(){
  var rows=[["ลูกค้า","ประเภท","รายการที่ขอยืนยัน","ธนาคาร/หน่วยงาน","ส่งให้ลูกค้า","ลูกค้าส่งกลับ","ส่งออกภายนอก","ภายนอกส่งกลับ","สถานะ"]];
data.forEach(function(c){c.banks.forEach(function(b){rows.push([c.name,b.type||"",picked(b),b.bank,fmt(b.sentCust),fmt(b.backCust),fmt(b.sentExt),fmt(b.backExt),LABEL[status(b)]])})});
  if(rows.length<2){say("ยังไม่มีข้อมูลให้ส่งออก");return}
  try{
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"ติดตามยืนยันยอด");
    XLSX.writeFile(wb,"bank-confirm-"+per.y+"-"+(per.m+1)+".xlsx");
  }catch(e){say("ส่งออกไม่สำเร็จ ลองใช้งานผ่านเบราว์เซอร์หรือดาวน์โหลดไฟล์ HTML ไปเปิดในเครื่อง")}
};
document.getElementById("addCust").onclick=function(){
  var i=document.getElementById("newCust"),n=i.value.trim();if(!n)return;
  data.push({id:uid(),name:n,banks:[newBank()]});
  i.value="";save();render()};
document.getElementById("newCust").onkeydown=function(e){if(e.key=="Enter")document.getElementById("addCust").click()};
document.getElementById("q").oninput=function(e){query=e.target.value.trim();render()};
document.getElementById("stats").onclick=function(e){var s=e.target.closest(".stat");if(!s)return;if(s.dataset.p){panelOpen=!panelOpen;render();return}if(s.dataset.f==null)return;panelOpen=false;filter=+s.dataset.f;render()};
document.getElementById("panel").onchange=function(e){
  var t=e.target;if(!t.dataset.o)return;var c=find(t.dataset.c),o=t.dataset.o,hit={},go=false;
  c.banks.forEach(function(b){
    if(b.id==t.dataset.b)go=true;
    if(!go)return;
    if(b.id==t.dataset.b||(t.checked&&OPT[b.type]&&OPT[b.type].indexOf(o)>-1)){
      b.tk={};if(t.checked)b.tk[o]=true;hit[b.id]=1}
  });
  t.closest(".cust").querySelectorAll("input").forEach(function(i){
    if(hit[i.dataset.b])i.checked=t.checked&&i.dataset.o==o});
  save()};
document.getElementById("list").onclick=function(e){
  var t=e.target.closest("button");if(!t)return;var c=find(t.dataset.c),a=t.dataset.a;
  if(a=="cal"){var pk=t.parentNode.querySelector(".pk");try{pk.showPicker()}catch(x){pk.focus()}return}
  if(a=="tick"){c.banks.forEach(function(b){if(b.id==t.dataset.b)b[t.dataset.f]=b[t.dataset.f]?"":today()})}
  else if(a=="addbank")c.banks.push(newBank());
  else if(a=="delcust"){if(!confirm("ลบลูกค้า "+c.name+" และรายการทั้งหมด?"))return;data=data.filter(function(x){return x!=c})}
  else if(a=="delbank"){if(!confirm("ลบรายการนี้?"))return;c.banks=c.banks.filter(function(b){return b.id!=t.dataset.b})}
  save();render()};
document.getElementById("list").addEventListener("focusout",function(e){var t=e.target;if(t.classList.contains("dt")){var c=find(t.dataset.c),bb=c&&c.banks.filter(function(b){return b.id==t.dataset.b})[0];if(bb)t.value=fmt(bb[t.dataset.k])}});
document.getElementById("list").addEventListener("input",function(e){var t=e.target;if(!t.classList.contains("dt"))return;var del=(e.inputType||"").indexOf("delete")==0;t.value=mask(t.value,del);if(t.value===""||t.value.length==10)commitD(t)});
document.getElementById("list").addEventListener("keydown",function(e){var t=e.target;if(e.key!="Enter"||!t.classList.contains("dt"))return;e.preventDefault();var all=[].slice.call(document.querySelectorAll('#list .dt[data-k="'+t.dataset.k+'"]')),n=all[all.indexOf(t)+(e.shiftKey?-1:1)];if(n){n.focus();n.select()}});
document.getElementById("list").addEventListener("focusin",function(e){if(e.target.classList.contains("dt"))e.target.select()});
document.getElementById("list").onchange=function(e){
  var t=e.target;
  if(t.classList.contains("pk")){var tx=t.parentNode.querySelector(".dt");tx.value=fmt(t.value);commitD(tx);return}
  if(t.classList.contains("dt"))return;
  if(!t.dataset.k)return;
  if(t.type=="date"&&t.value&&parseInt(t.value,10)<1900)return;
  var c=find(t.dataset.c);
  var hb;c.banks.forEach(function(b){if(b.id==t.dataset.b){b[t.dataset.k]=t.value;hb=b}});
  save();
  if(t.type=="date"&&hb){liveUpdate(t,hb);return}
  render()};
function liveUpdate(t,b){
  var tr=t.closest("tr"),s=status(b),bd=tr.querySelector(".badge");
  bd.className="badge s"+s;bd.textContent=LABEL[s];
  tr.querySelector(".late").textContent=late(b);
  tr.querySelectorAll("button.tick").forEach(function(k){var on=!!b[k.dataset.f];k.classList.toggle("on",on);k.title=on?"ล้างวันที่":"ใส่วันที่วันนี้"});
  var cnt=[0,0,0,0,0],total=0;
  data.forEach(function(c){c.banks.forEach(function(x){cnt[status(x)]++;total++})});
  var st=document.querySelectorAll("#stats .stat b");
  if(st.length==7){st[0].textContent=total;st[1].textContent=total;for(var i=0;i<5;i++)st[i+2].textContent=cnt[i]}
  var cu=t.closest(".cust"),c2=find(t.dataset.c),sm=cu&&cu.querySelector(".ch small");
  if(sm&&c2)sm.textContent="เสร็จ "+c2.banks.filter(function(x){return status(x)==4}).length+"/"+c2.banks.length+" รายการ";
}
function fitOne(t){
  var size=15,min=9;
  t.style.fontSize=size+"px";
  t.style.height="auto";
  var cs=getComputedStyle(t),pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  while(size>min&&(t.scrollHeight-pad)>size*1.3*2+1){
    size-=0.5;t.style.fontSize=size+"px";t.style.height="auto";
  }
  t.style.height=t.scrollHeight+"px";
}
function fit(){document.querySelectorAll("td.bk textarea").forEach(fitOne)}
var _render=render;render=function(){_render();fit()};
window.addEventListener("resize",fit);
document.getElementById("list").addEventListener("input",function(e){if(e.target.tagName=="TEXTAREA")fitOne(e.target)});
var MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
var PKEY="bankconfirm-period",per={m:11,y:2026};
try{var pr=JSON.parse(localStorage.getItem(PKEY));if(pr&&pr.m>=0&&pr.m<=11&&pr.y)per=pr}catch(e){}
function showPer(){document.getElementById("pl").textContent=MONTHS[per.m]+" "+(per.y+543)}
function keyFor(p){return(p.y==2026&&p.m==11)?"bankconfirm-v1":"bankconfirm-v1-"+p.y+"-"+p.m}
function movePer(d){per.m+=d;if(per.m<0){per.m=11;per.y--}else if(per.m>11){per.m=0;per.y++}try{localStorage.setItem(PKEY,JSON.stringify(per))}catch(e){}showPer();KEY=keyFor(per);data=[];filter=-1;query="";document.getElementById("q").value="";panelOpen=false;load();render()}
document.getElementById("pm").onclick=function(){movePer(-1)};
document.getElementById("pn").onclick=function(){movePer(1)};
showPer();
KEY=keyFor(per);
load();
data.forEach(function(c){c.banks.forEach(function(b){if(b.type=="ธนาคาร")b.bank=b.bank.replace(/\s*\((?!มหาชน)[^)]*\)\s*$/,"")})});
save();render();
