<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ยืนยันยอดภายนอกทีม C-2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#ffffff;--card:#ffffff;--sh:0 1px 2px rgba(20,30,28,.06),0 8px 22px rgba(20,30,28,.09);--shh:0 2px 4px rgba(20,30,28,.08),0 14px 30px rgba(20,30,28,.15);--tx:#1c2321;--mu:#68716d;--bd:#e7eae8;--ac:#0f6b5c;--acb:#d8ece6;--on:#fff;--ok:#1a7f4b;--okb:#dff2e6;--wt:#946000;--wtb:#fbefcf;--rd:#b42318;--gy:#59636e;--gyb:#e9e6de;--bl:#1f5fbf;--blb:#e1ecfa;--pu:#6b4bb8;--pub:#ece6fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Thai","Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--bd)}
.top small{display:block;font-size:12px;letter-spacing:.04em;color:var(--ac);font-weight:600;margin-bottom:4px}
h1{font-size:26px;line-height:1.25;margin:0;font-weight:600}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--bd)}
@media (max-width:640px){.logo{width:44px;height:44px}}
.mp{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px}
.mp b{font-size:16px;font-weight:600;min-width:150px;text-align:center}
.mp button{background:transparent;color:var(--tx);border:0;border-radius:50%;width:36px;height:36px;padding:0;font-size:20px;line-height:1}
.mp button:hover{background:var(--acb);color:var(--ac)}
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;box-shadow:var(--sh)}
.pick select:hover{border-color:var(--ac)}
@media (max-width:640px){.pick{width:100%}.pick select{flex:1 1 0}.pick .mp{flex:1 1 100%;justify-content:space-between}}
.up{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:8px;counter-reset:s}
.upb{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 14px 14px 52px;position:relative;transition:border-color .15s,transform .15s}
.upb:hover{border-color:var(--ac);transform:translateY(-2px)}
.upb::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--acb);color:var(--ac);font-weight:600;font-size:13px;display:grid;place-items:center}
.upb b{display:block;margin-bottom:8px;font-weight:600;font-size:14px}
.upb input[type=file]{width:100%;font-size:13px;color:var(--mu)}
.upb input[type=file]::file-selector-button{font:inherit;font-size:13px;background:transparent;color:var(--ac);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;margin-right:8px;cursor:pointer}
.msg{color:var(--mu);font-size:13px;margin:0 0 24px;min-height:20px}
.type{font-size:12px;color:var(--mu);display:block;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:600}
.stat span{font-size:13px;color:var(--mu)}
.stat.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.stat:nth-child(1){background:var(--ac);border-color:var(--ac);color:var(--on)}
.stat:nth-child(1) span{color:var(--on);opacity:.85}
.stat:nth-child(3){border-top-color:var(--gy)}.stat:nth-child(4){border-top-color:var(--wt)}.stat:nth-child(5){border-top-color:var(--bl)}.stat:nth-child(6){border-top-color:var(--pu)}.stat:nth-child(7){border-top-color:var(--ok)}
.panel{margin-bottom:18px}
.ph{margin:0 0 14px;font-size:16px;font-weight:600}
.ck{display:inline-flex;align-items:center;gap:6px;margin-right:16px;white-space:nowrap;font-size:14px;cursor:pointer}
.ck input{width:auto;accent-color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.bar #q{order:1;flex:2 1 260px}
.bar #newCust{order:2;flex:1 1 200px}
.bar #addCust{order:3}.bar #exp{order:4;margin-left:auto}
input,button,select,textarea{font:inherit;color:var(--tx)}
input[type=text],input[type=date]{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;min-width:0}
input[type=date]{width:100%;padding:6px 8px;font-size:14px}
.dc{display:flex;align-items:center;gap:6px}
.dc input[type=date]{flex:1;min-width:0}
.pw{position:relative;flex:1;min-width:150px;display:flex;align-items:center}
.pw .dt{width:100%;padding:6px 34px 6px 9px;font-size:14px;font-variant-numeric:tabular-nums}
.cal{position:absolute;right:3px;background:transparent;color:var(--mu);padding:4px;border-radius:6px;display:grid;place-items:center}
.cal:hover{color:var(--ac);filter:none;background:var(--acb)}
.pk{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.tick{background:transparent;border:0;padding:0;width:30px;height:30px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--mu)}
button.tick svg{width:28px;height:28px;display:block}
button.tick:hover{color:var(--ac)}
button.tick.on{color:#0f6b5c}
button.tick.on .ring{fill:#0f6b5c;stroke:#0f6b5c}
button.tick.on .chk{stroke:#fff}
button{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:8px 15px;cursor:pointer;font-weight:500;transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.ghost:hover{border-color:var(--ac);filter:none}
button.x{background:transparent;color:var(--rd);padding:4px 8px}
.cust{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:16px;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ch h2{margin:0;font-size:17px;font-weight:600;flex:1}
.ch small{color:var(--mu);background:var(--gyb);border-radius:999px;padding:2px 10px;font-size:12px}
.ch h2.hh{flex:0 1 auto}
.chips{flex:1;display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.ch small.chip{background:var(--acb);color:var(--ac);display:inline-flex;gap:5px;align-items:center}
.ch small.chip b{font-weight:600}
.ch small.chip.un{background:var(--wtb);color:var(--wt)}
td.nc{min-width:200px}
td.nc textarea{width:100%;background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;resize:none;overflow:hidden;line-height:1.35;font-size:14px;display:block;min-height:36px}
td.nc textarea:focus{background:var(--card);border-color:var(--ac)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1300px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td,tr:hover>td{background:color-mix(in srgb,var(--acb) 35%,transparent)}
th{font-size:12px;color:var(--mu);font-weight:600;background:var(--bg);letter-spacing:.02em}
td.bk{min-width:260px}
td.bk textarea{width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;min-width:0;resize:none;overflow:hidden;line-height:1.3;font-size:15px;display:block;white-space:normal;word-break:break-word}
td.bk textarea:hover,td.bk textarea:focus{background:var(--card);border-color:var(--bd)}
th.no,td.no{width:56px;min-width:56px;max-width:56px;text-align:center;color:var(--mu)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:13px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s0{background:var(--gyb);color:var(--gy)}.s1{background:var(--wtb);color:var(--wt)}.s2{background:var(--blb);color:var(--bl)}.s3{background:var(--pub);color:var(--pu)}.s4{background:var(--okb);color:var(--ok)}
.late{color:var(--rd);font-size:12px;display:block;margin-top:2px}
.empty{text-align:center;color:var(--mu);padding:44px 10px}
.cust,.upb,.stat,.mp{box-shadow:var(--sh)}
.upb:hover,.stat:hover{box-shadow:var(--shh)}
.stat.on{box-shadow:0 0 0 1px var(--ac),var(--sh)}
th{background:color-mix(in srgb,var(--gyb) 45%,var(--card))}
.panel .cust{padding:0}
th.no,td.no,th:nth-child(2),td:nth-child(2){position:sticky;z-index:2;background:var(--card)}
th.no,td.no{left:0}
th:nth-child(2),td:nth-child(2){left:56px;box-shadow:none}
th.no,th:nth-child(2){z-index:3;background:color-mix(in srgb,var(--gyb) 45%,var(--card))}
tr:hover>td.no,tr:hover>td:nth-child(2){background:color-mix(in srgb,var(--acb) 35%,var(--card))}
@media (max-width:640px){th.no,td.no{width:34px;min-width:34px;padding:9px 2px}th:nth-child(2),td:nth-child(2){left:34px;padding:9px 6px}td.bk{min-width:160px;max-width:160px}td.bk textarea{padding:4px 5px}.type{font-size:11px}}
.panel .cust .scroll{max-height:none}
@media (max-width:640px){.wrap{padding:18px 14px 60px}h1{font-size:21px}.bar #exp{margin-left:0}}
@media (max-width:640px){.ch h2.hh{flex:1 1 100%}.chips{flex:1 1 100%;order:5}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#lock{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;padding:20px}
#lock .box{width:100%;max-width:340px;text-align:center}
#lock h2{margin:0 0 16px;font-size:18px;font-weight:600}
#lock input{width:100%;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
#lock button{width:100%}
#lock p{color:var(--rd);font-size:13px;min-height:20px;margin:10px 0 0}
</style>
</head>
<body>
<div id="lock"><div class="box"><h2>กรอกรหัสผ่านเพื่อเข้าใช้งาน</h2>
<input type="password" id="lpw" autocomplete="off" placeholder="รหัสผ่าน">
<button type="button" id="lgo">เข้าสู่ระบบ</button><p id="lerr"></p></div></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand"><!-- วางแท็ก <img class="logo" ...> โลโก้เดิมของคุณตรงนี้ได้ --><div><small>ทีม C-2 · ยืนยันยอดภายนอก</small><h1>ระบบติดตามยืนยันยอดภายนอก</h1></div></div>
    <div class="pick"><select id="ys" aria-label="ปี"></select><select id="ms" aria-label="เดือน"></select><div class="mp"><button type="button" id="pm" aria-label="เดือนก่อนหน้า">‹</button><b id="pl"></b><button type="button" id="pn" aria-label="เดือนถัดไป">›</button></div></div>
  </header>
  <div class="up">
    <div class="upb"><b>ไฟล์ธนาคาร</b><input type="file" accept=".csv,.xlsx,.xls" data-type="ธนาคาร"></div>
    <div class="upb"><b>ไฟล์สหกรณ์</b><input type="file" accept=".csv,.xlsx,.xls" data-type="สหกรณ์"></div>
    <div class="upb"><b>เงินลงทุนในหลักทรัพย์/ธนาคาร</b><input type="file" accept=".csv,.xlsx,.xls" data-type="เงินลงทุน"></div>
  </div>
  <p class="msg" id="msg"></p>
  <div class="stats" id="stats"></div>
  <div id="panel"></div>
  <div class="bar">
    <input type="text" id="q" placeholder="ค้นหาลูกค้า / ชื่อหน่วยงาน / ประเภท">
    <input type="text" id="newCust" placeholder="ชื่อลูกค้าใหม่">
    <button id="addCust">+ เพิ่มลูกค้า</button>
    <button class="ghost" id="exp">ส่งออก Excel</button>
  </div>
  <div id="list"></div>
</div>
<script>
var KEY="bankconfirm-v1",data=[],filter=-1,query="";
var LABEL=["ยังไม่ส่งลูกค้า","รอลูกค้าส่งกลับ","รอส่งออกภายนอก","รอภายนอกตอบกลับ","เสร็จสิ้น"];
var API="https://script.google.com/macros/s/AKfycbxTsDIHLJ2HkkNta6IEOGaHxto1cE3kZWmaYmOPuyk-Yps9iw0dFg9aTKN3f87PUM8rhQ/exec";
var _t,pend=null,synced={},pullSeq=0,pullAbort=null,_pt;
function hasAPI(){return /^https:\/\/script\.google\.com\/.+\/exec$/.test(API)}

/* ===== รหัสผ่าน + เข้ารหัสข้อมูลในเครื่อง ===== */
var CK=null,PW="",CACHE={},SALT_KEY="bankconfirm-salt",VER_KEY="bankconfirm-verify";
function b64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function deriveKey(pw){
  var salt=localStorage.getItem(SALT_KEY);
  if(!salt){salt=b64(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem(SALT_KEY,salt)}
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(salt),iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function enc(obj){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},CK,new TextEncoder().encode(JSON.stringify(obj))));
  var all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);
  return "enc1:"+b64(all);
}
async function dec(s){
  var all=unb64(s.slice(5));
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:all.slice(0,12)},CK,all.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function putLocal(k,d){enc(d).then(function(s){try{localStorage.setItem(k,s)}catch(e){}})}
async function unlock(pw){
  CK=await deriveKey(pw);
  var ver=localStorage.getItem(VER_KEY);
  if(ver){
    try{await dec(ver)}catch(e){CK=null;return false}
  }else{
    if(hasAPI()){
      var r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({token:pw,action:"get",key:"bankconfirm-v1"})}).then(function(x){return x.json()});
      if(!Array.isArray(r)){CK=null;return false}
    }
    localStorage.setItem(VER_KEY,await enc({ok:1}));
  }
  PW=pw;
  var keys=[];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf("bankconfirm-v1")===0)keys.push(k)}
  for(var j=0;j<keys.length;j++){
    var v=localStorage.getItem(keys[j]);
    try{
      if(v.indexOf("enc1:")===0)CACHE[keys[j]]=await dec(v);
      else{CACHE[keys[j]]=JSON.parse(v)||[];putLocal(keys[j],CACHE[keys[j]])}
    }catch(e){}
  }
  return true;
}
function load(){data=CACHE[KEY]||[]}
function getTok(){return PW}
function badTok(k){alert("รหัสผ่านไม่ตรงกับเซิร์ฟเวอร์ (อาจมีการเปลี่ยนรหัส) กรุณาเข้าสู่ระบบใหม่");location.reload()}
function maskAcc(s){var d=String(s).replace(/\D/g,"");return d.length>4?"xxxx"+d.slice(-4):s}
function scrub(arr){arr.forEach(function(c){c.banks.forEach(function(b){b.bank=(b.bank||"").replace(/\(([^)]*)\)\s*$/,function(m,x){return"("+maskAcc(x)+")"})})});return arr}

/* ===== ซิงก์ Google Sheet ===== */
function save(){
  CACHE[KEY]=data;putLocal(KEY,data);
  pend={k:KEY,d:data};
  clearTimeout(_t);
  _t=setTimeout(function(){var p=pend;pend=null;if(p)push(p.k,p.d)},800);
}
function push(k,d){
  var tok=getTok();
  if(!hasAPI()||!synced[k]||!tok)return;
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({token:tok,action:"set",key:k,data:d})})
  .then(function(r){return r.json()})
  .then(function(r){if(r&&r.error==="unauthorized")badTok(k)})
  .catch(function(){say("บันทึกขึ้น Google Sheet ไม่สำเร็จ")});
}
function pull(){
  var k=KEY,seq=++pullSeq;
  if(pullAbort)pullAbort.abort();
  if(!hasAPI()){synced[k]=true;return}
  var tok=getTok();
  if(!tok){say("ยังไม่ได้เข้าสู่ระบบ");return}
  pullAbort=window.AbortController?new AbortController():null;
  var opt={method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:tok,action:"get",key:k})};
  if(pullAbort)opt.signal=pullAbort.signal;
  fetch(API,opt)
  .then(function(r){return r.json()})
  .then(function(d){
    if(seq!==pullSeq||k!==KEY)return;
    if(!Array.isArray(d)){if(d&&d.error==="unauthorized")badTok(k);else say("ดึงข้อมูลจากชีตไม่สำเร็จ");return}
    scrub(d);
    if(d.length){
      var ln={};
      data.forEach(function(c){c.banks.forEach(function(b){if(b.note)ln[b.id]=b.note})});
      d.forEach(function(c){c.banks.forEach(function(b){if(!b.note)b.note=ln[b.id]||""})});
      if(JSON.stringify(d)!==JSON.stringify(data)){
        data=d;
        CACHE[k]=data;putLocal(k,data);
        render();
      }
    }
    synced[k]=true;
  })
  .catch(function(err){
    if(err&&err.name==="AbortError")return;
    if(seq===pullSeq)say("ดึงข้อมูลจาก Google Sheet ไม่สำเร็จ (ยังไม่ส่งขึ้นชีต เพื่อกันเขียนทับ)");
  });
}

/* ===== ตัวแอป ===== */
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function status(b){if(b.backExt)return 4;if(b.sentExt)return 3;if(b.backCust)return 2;if(b.sentCust)return 1;return 0}
function picked(b){var tk=b.tk||{};return Object.keys(tk).filter(function(k){return tk[k]})[0]||""}
var TICK='<svg viewBox="0 0 32 32" aria-hidden="true"><circle class="ring" cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/><path class="chk" d="M9.5 16.5l4.5 4.5 8.5-9.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function tickBtn(b,f,k){return '<button type="button" class="tick'+(b[f]?' on':'')+'" data-a="tick" data-f="'+f+'" '+k+' title="'+(b[f]?'ล้างวันที่':'ใส่วันที่วันนี้')+'">'+TICK+'</button>'}
function today(){var d=new Date(),m=d.getMonth()+1,y=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(y<10?"0":"")+y}
var ORDER={"ธนาคาร":0,"สหกรณ์":1,"เงินลงทุน":2};

function parseRows(rows,type){
  var hi=-1,ci=0,bi=1,ai=-1,i,j;
  for(i=0;i<Math.min(rows.length,12)&&hi<0;i++){
    var r=rows[i].map(cell),c=-1,b=-1,a=-1;
    r.forEach(function(t,k){
      if(/เลขที่/.test(t)){if(a<0)a=k}
      else if(/สหกรณ์|ลูกค้า/.test(t)){if(c<0)c=k}
      else if(/ธนาคาร|หน่วยงาน|สถาบัน|ผู้ออก/.test(t)){if(b<0)b=k}
    });
    if(c>=0&&b>=0){hi=i;ci=c;bi=b;ai=a}
  }
  var out=[];
  for(i=hi+1;i<rows.length;i++){
    var r2=rows[i],cn=cell(r2[ci]),bn=cell(r2[bi]);
    if(!cn||!bn)continue;
    if(type!="ธนาคาร"&&ai>=0&&cell(r2[ai]))bn+=" ("+maskAcc(cell(r2[ai]))+")";
    out.push([cn,bn])
  }

function importFile(inp){
  var f=inp.files[0];if(!f)return;var type=inp.dataset.type;
  var fr=new FileReader();
  fr.onload=function(e){
    try{
      var wb=readBook(e.target.result,f.name);
      var res={pairs:[],header:true},sheetInfo=[];
      wb.SheetNames.forEach(function(sn){
        var r=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""}),type);
        res.pairs=res.pairs.concat(r.pairs);
        if(!r.header)res.header=false;
        sheetInfo.push(sn+" "+r.pairs.length);
      });
      var added=0,skipped=0,newC=0;
      res.pairs.forEach(function(p){
        var c=data.filter(function(x){return x.name==p[0]})[0];
        if(!c){c={id:uid(),name:p[0],banks:[]};data.push(c);newC++}
        var dup=c.banks.some(function(b){return b.bank==p[1]&&b.type==type});
        if(dup){skipped++;return}
        c.banks.push(newBank(p[1],type));added++;
      });
      save();render();
      say("นำเข้า “"+type+"” จาก "+f.name+": เพิ่ม "+added+" รายการ (ลูกค้าใหม่ "+newC+" ราย), ข้ามรายการซ้ำ "+skipped+(res.header?"":" · ไม่พบหัวตาราง ใช้คอลัมน์ 1 และ 2"));
    }catch(err){say("อ่านไฟล์ไม่สำเร็จ: "+err.message)}
    inp.value="";
  };
  fr.readAsArrayBuffer(f);
}

function fitOne(t){

  }
  t.style.height=t.scrollHeight+"px";
}

  ys.innerHTML=h;
  h="";for(i=0;i<12;i++)h+='<option value="'+i+'">'+MONTHS[i]+'</option>';
  ms.innerHTML=h;
  ys.onchange=ms.onchange=function(){goPer(+ms.value,+ys.value)};
}
function showPer(){
  document.getElementById("pl").textContent=MONTHS[per.m]+" "+(per.y+543);
  var ys=document.getElementById("ys"),ms=document.getElementById("ms");
  if(!ys.querySelector('option[value="'+per.y+'"]')){var o=document.createElement("option");o.value=per.y;o.textContent=per.y+543;ys.appendChild(o)}
  ys.value=per.y;ms.value=per.m;
}
function keyFor(p){return(p.y==2026&&p.m==11)?"bankconfirm-v1":"bankconfirm-v1-"+p.y+"-"+p.m}
function movePer(d){
  var m=per.m+d,y=per.y;
  if(m<0){m=11;y--}else if(m>11){m=0;y++}
  goPer(m,y);
}
function goPer(m,y){
  if(m===per.m&&y===per.y)return;
  if(pend){clearTimeout(_t);push(pend.k,pend.d);pend=null}
  ++pullSeq;if(pullAbort)pullAbort.abort();
  per.m=m;per.y=y;
  try{localStorage.setItem(PKEY,JSON.stringify(per))}catch(e){}
  showPer();
  KEY=keyFor(per);
  data=[];filter=-1;query="";
  document.getElementById("q").value="";
  panelOpen=false;
  load();render();
  clearTimeout(_pt);_pt=setTimeout(pull,350);
}
document.getElementById("pm").onclick=function(){movePer(-1)};
document.getElementById("pn").onclick=function(){movePer(1)};
initSel();showPer();

/* ===== เริ่มระบบหลังกรอกรหัสถูกต้อง ===== */
function start(){
  KEY=keyFor(per);
  load();
  data.forEach(function(c){c.banks.forEach(function(b){if(b.type=="ธนาคาร")b.bank=b.bank.replace(/\s*\((?!มหาชน)[^)]*\)\s*$/,"")})});
  scrub(data);
  save();render();pull();
}
var tries=0;
async function tryLogin(){
  var pw=document.getElementById("lpw").value,err=document.getElementById("lerr"),go=document.getElementById("lgo");
  if(!pw)return;
  go.disabled=true;err.textContent="กำลังตรวจสอบ...";
  var ok=false;
  try{ok=await unlock(pw)}catch(e){err.textContent="ตรวจสอบไม่สำเร็จ (เช็คอินเทอร์เน็ตแล้วลองใหม่)";go.disabled=false;return}
  if(ok){
    document.getElementById("lock").remove();
    document.getElementById("app").hidden=false;
    start();
  }else{
    tries++;
    document.getElementById("lpw").value="";
    err.textContent="รหัสผ่านไม่ถูกต้อง";
    setTimeout(function(){go.disabled=false;document.getElementById("lpw").focus()},Math.min(1000*tries,8000));
  }
}
document.getElementById("lgo").onclick=tryLogin;
document.getElementById("lpw").onkeydown=function(e){if(e.key==="Enter")tryLogin()};
document.getElementById("lpw").focus();
</script>
